[package]
name = "agentlaunch-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentlaunch-slint"
path = "src/main.rs"

[dependencies]
agentlaunch-core.workspace = true
slint = { version = ">=1.9, <=1.17", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-skia", "unstable-winit-030"] }

[build-dependencies]
slint-build = ">=1.9, <=1.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
